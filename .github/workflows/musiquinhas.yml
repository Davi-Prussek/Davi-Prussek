name: Generate Music Card

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  music:
    runs-on: ubuntu-latest

    steps:
      - name: Generate music card
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.plugin.music.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Davi-Prussek
          base: ""
          plugin_music: yes
          plugin_music_playlist: https://open.spotify.com/embed/playlist/6b5YetR80d5pn9o6xENtvP
          plugin_music_limit: 3
          output_action: commit
          plugins_errors_fatal: yes
